services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: shopsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-shopsphere-lab-password}
      POSTGRES_DB: shopsphere
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere -d shopsphere"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  # ========================================
  # Redis Cache (optional)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: shopsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  # ========================================
  # Backend API
  # ========================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-api
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      LAB_MODE: ${LAB_MODE:-vulnerable}
      DATABASE_URL: ${DATABASE_URL:-postgresql://shopsphere:shopsphere-lab-password@postgres:5432/shopsphere}
      JWT_SECRET: ${JWT_SECRET:-shopsphere-lab-jwt-secret-change-me}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npx tsx src/server.ts"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shopsphere-network

  # ========================================
  # Frontend (React/Vite)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - shopsphere-network

  # ========================================
  # Nginx Reverse Proxy
  # ========================================
  nginx:
    image: nginx:1.27-alpine
    container_name: shopsphere-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:${NGINX_PORT:-8080}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/${LAB_MODE:-vulnerable}.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - shopsphere-network

volumes:
  postgres_data:

networks:
  shopsphere-network:
    driver: bridge