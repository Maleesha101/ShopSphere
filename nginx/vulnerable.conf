# ShopSphere Nginx Configuration - VULNERABLE MODE
# Intentionally weak security configuration for educational purposes

server {
    listen 8080;
    server_name localhost;

    # HTTP instead of HTTPS (SM-03: Missing TLS/HTTPS)
    # No redirect to HTTPS in vulnerable mode

    # Security headers DISABLED in vulnerable mode (SM-01)
    # No Content-Security-Policy, X-Frame-Options, etc.

    # CORS HEADERS - Intentionally weak (SM-02: Weak CORS)
    # Actually, CORS is handled by Express backend, but nginx can add additional headers
    # In vulnerable mode, we don't restrict anything here
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range";

    # SM-04: Unnecessary HTTP Methods - ACCEPTED in vulnerable mode
    # OPTIONS, TRACE, etc. are allowed (handled by backend/nginx)

    # Frontend serving
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # In vulnerable mode, we don't add security headers here either
        # They come from the backend
    }

    # SM-04: Accept unnecessary HTTP methods (OPTIONS, TRACE, etc.)
    # These are passed through to the backend where they're handled
    # In vulnerable mode, we don't filter them out

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}